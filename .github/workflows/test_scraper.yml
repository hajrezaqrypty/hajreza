name: Run StreamWide Scraper

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Search term'
        required: true
  repository_dispatch:
    types: [quick_search]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run Scraper
        env:
          CF_API_URL: ${{ secrets.CF_API_URL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          SITE_COOKIES: ${{ secrets.SITE_COOKIES }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          REQ_KEY: ${{ github.event.client_payload.req_key }}
          SEARCH_TERM: ${{ github.event.client_payload.query }}
          MODE: ${{ github.event.client_payload.mode }}
          COUNT: ${{ github.event.client_payload.count }}
          LAST_SEEN_URL: ${{ github.event.client_payload.last_seen_url }}
        run: python scraper.py

      - name: Commit and push DB files
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add db/
          git commit -m "Auto update: ${{ github.event.client_payload.query }}" || echo "No changes to commit"
          git push
